services:
  postgres:
    image: postgres:16-alpine
    container_name: photography-outreach-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: outreach
      POSTGRES_PASSWORD: outreach
      POSTGRES_DB: photography_outreach
    ports:
      - "5433:5432"
    volumes:
      - photography_outreach_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outreach -d photography_outreach"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  photography_outreach_pgdata:
